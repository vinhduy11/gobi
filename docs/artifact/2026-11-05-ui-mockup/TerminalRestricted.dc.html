<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gobi terminal restricted</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
*{box-sizing:border-box}
.win{font:13px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",sans-serif;color:var(--text);background:var(--bg);display:flex;flex-direction:column;overflow:hidden;border-radius:12px;border:1px solid var(--sep)}
.mono{font:12px/20px ui-monospace,"SF Mono",Menlo,monospace}
.dot{width:12px;height:12px;border-radius:50%}
.tb{height:52px;background:var(--bar);border-bottom:1px solid var(--sep);display:flex;align-items:center;gap:8px;padding:0 14px;flex:none}
.t2{color:var(--text2)}
.ic{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ptab{padding:0 12px;height:30px;display:flex;align-items:center;color:var(--text2);border-bottom:2px solid transparent}
.ptab.on{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
.term{background:var(--term);color:var(--termText)}
.tt{display:flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:6px;color:var(--text2)}
.tt.on{background:var(--accentBg);color:var(--accentT)}
.ib{width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;border-radius:6px;color:var(--text2)}
.menu{position:absolute;background:var(--bg);border:1px solid var(--sep);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.25);padding:4px;min-width:250px}
.mi{display:flex;justify-content:space-between;gap:24px;padding:4px 10px;border-radius:5px}
.mi.on{background:var(--accent);color:#fff}
.sep{height:1px;background:var(--sep);margin:4px 6px}
.btn{height:28px;padding:0 14px;border:1px solid var(--sep);border-radius:6px;background:var(--bg);color:var(--text);font:inherit}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.g{color:var(--ok)}.b{color:var(--accentT)}.y{color:var(--warn)}.d{color:var(--text2)}
</style>
</helmet>
<div class="win" style="width: 1000px; height: 360px; {{vars}}">
<div style="display:flex;align-items:center;border-bottom:1px solid var(--sep);padding:0 8px;flex:none;background:var(--bar)"><div class="ptab">Problems</div><div class="ptab">Tests</div><div class="ptab on">Terminal</div><div class="ptab">Debug</div><div class="ptab">Profiler</div><div class="ptab">Git</div><div class="ptab">Output</div><span style="flex:1"></span><span class="ib">&#8963;</span></div>
<div style="padding:28px 32px;display:flex;flex-direction:column;gap:10px;align-items:flex-start;flex:1"><div style="font-weight:700;font-size:15px">Terminals are off in Restricted Mode</div><div class="t2" style="max-width:560px">A terminal runs commands as you, and a project you have not trusted can put commands in its files. Trust the project to open a terminal here.</div><div style="display:flex;gap:8px;margin-top:6px"><button class="btn pri">Trust Project&#8230;</button><button class="btn">Learn More</button></div></div>
<div class="t2" style="display:flex;gap:16px;padding:4px 14px;border-top:1px solid var(--sep);font-size:12px;flex:none;background:var(--bar)"><span>Restricted Mode</span><span>gopls ready</span></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false,"section":"Appearance"},"$preview":{"width":1000,"height":360}}'>
class Component extends DCLogic {
  renderVals() {
    const L = {bg:'#FFFFFF',bar:'#ECECEF',text:'#1D1D1F',text2:'#5C5C61',sep:'#D6D6DA',hover:'rgba(0,0,0,.06)',accent:'#007AFF',accentT:'#0058B8',accentBg:'rgba(0,122,255,.14)',term:'#FAFAFB',termText:'#1D1D1F',ok:'#1B7F3B',warn:'#9A6700'};
    const D = {bg:'#1E1E1E',bar:'#2A2A2C',text:'#F2F2F7',text2:'#A8A8AE',sep:'#454549',hover:'rgba(255,255,255,.08)',accent:'#0A84FF',accentT:'#64B0FF',accentBg:'rgba(10,132,255,.28)',term:'#141416',termText:'#E6E6EA',ok:'#5AD27A',warn:'#E5B567'};
    const p = this.props.dark ? D : L;
    return { vars: Object.keys(p).map((k) => '--' + k + ':' + p[k]).join(';') };
  }
}
</script>
</body>
</html>
