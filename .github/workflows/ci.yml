name: ci

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  ci:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache-dependency-path: core/go.sum
      - run: scripts/ci.sh
